<div class="container mx-auto p-6 bg-slate-50 min-h-screen">
  <div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-sm border border-slate-200 p-8">
    <div class="mb-8 border-b pb-4">
      <h1 class="text-2xl font-bold text-slate-800">{{ tenantId ? 'Editar' : 'Nuevo' }} Tenant</h1>
      <p class="text-slate-500 text-sm mt-1">Administración de red de talleres independiente</p>
    </div>

    <div *ngIf="error" class="mb-6 p-4 bg-rose-50 border border-rose-200 text-rose-700 rounded-lg text-sm flex items-center">
      <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
      {{ error }}
    </div>

    <form [formGroup]="tenantForm" (ngSubmit)="onSubmit()" class="space-y-6">
      
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Nombre Comercial <span class="text-rose-500">*</span></label>
        <input type="text" formControlName="nombre" 
               class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors"
               placeholder="Ej: Talleres Unidos S.A.">
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Subdominio / Slug (Opcional)</label>
        <input type="text" formControlName="slug" 
               class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors"
               placeholder="Ej: talleres-unidos (se genera automáticamente si lo dejas vacío)">
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Estado</label>
        <select formControlName="esta_activo" 
                class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors">
          <option [ngValue]="true">Activo</option>
          <option [ngValue]="false">Inactivo</option>
        </select>
      </div>

      <div *ngIf="!tenantId">
        <h3 class="text-lg font-medium text-slate-800 mb-3 border-b pb-2">Datos Iniciales (Opcional)</h3>
        
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Email del Administrador</label>
            <input type="email" formControlName="email_admin" 
                   class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors"
                   placeholder="admin@taller.com">
            <p class="text-xs text-slate-500 mt-1">Se creará el usuario y se le enviarán las credenciales por correo.</p>
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Plan de Suscripción</label>
            <select formControlName="plan" 
                    class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors">
              <option value="basico">Básico (Gratis / Prueba)</option>
              <option value="profesional">Profesional</option>
              <option value="empresarial">Empresarial</option>
            </select>
          </div>
        </div>
      </div>

      <div class="pt-6 border-t flex justify-end space-x-3">
        <button type="button" routerLink="/tenants" 
                class="px-5 py-2.5 text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-lg font-medium transition-colors">
          Cancelar
        </button>
        <button type="submit" [disabled]="tenantForm.invalid || loading"
                class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium transition-colors disabled:opacity-50 flex items-center shadow-sm">
          <span *ngIf="loading" class="animate-spin mr-2 h-4 w-4 border-2 border-white border-t-transparent rounded-full"></span>
          {{ tenantId ? 'Actualizar' : 'Crear' }} Tenant
        </button>
      </div>
    </form>
  </div>
</div>
